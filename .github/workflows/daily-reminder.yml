name: Daily reminder (manual)

on:
  # 每日提醒已迁移到 Supabase pg_cron（sql/reminder.sql），
  # 这里只保留手动触发，用于排查问题时测试
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/daily-reminder.js
        env:
          SUPABASE_URL: https://jbkqugkxuoegnfhejwbi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
